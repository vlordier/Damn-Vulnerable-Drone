[package]
name = "antoine-mavlink-jetstream-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Loopback MAVLink gateway prototype with JetStream telemetry and gated request egress"

[dependencies]
async-nats = "0.50"
base64 = "0.22"
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-common"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace]

[dev-dependencies]
tempfile = "3"
