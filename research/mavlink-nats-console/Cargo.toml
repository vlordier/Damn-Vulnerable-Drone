[package]
name = "mavlink-nats-console"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Loopback MAVLink console for the Antoine NATS SITL bridge"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures-util = "0.3"
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-common"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
serde_json = "1"

[workspace]
